<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10302A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mise en Place">
<title>Mise en Place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface2:#F5F8F6; --line:#D7DFDA; --line2:#E6ECE8;
  --text:#14201B; --muted:#5A6861; --faint:#8A9690;
  --ink:#10302A; --ink2:#18403A; --ink-text:#E3EEE9; --ink-muted:#9DB7AE;
  --btn:#13382F; --btn-text:#FFFFFF; --accent:#D39A2A; --accent-soft:#F7ECD6;
  --c-cozinha:#C2522E; --c-bar:#16798A; --c-adega:#8A2F57;
  --ok:#2C7A4B; --ok-soft:#E1F1E7; --warn:#A96E12; --warn-soft:#F8ECD3; --bad:#B8362A; --bad-soft:#F8E1DE; --info:#2E5E8C; --info-soft:#E1EBF5;
  --shadow:0 18px 50px rgba(16,40,34,.18);
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1412; --surface:#151F1C; --surface2:#1A2622; --line:#2A3833; --line2:#22302B;
    --text:#E3ECE7; --muted:#9BAAA3; --faint:#6F7F78;
    --ink:#09100E; --ink2:#12201C; --ink-text:#DCE9E3; --ink-muted:#7E978E;
    --btn:#E2AA3E; --btn-text:#1A1406; --accent:#E2AA3E; --accent-soft:#3A2F17;
    --c-cozinha:#E57450; --c-bar:#3BA9BB; --c-adega:#CB5E90;
    --ok:#5DBB82; --ok-soft:#18342A; --warn:#E0A94A; --warn-soft:#3A2E16; --bad:#EE7A6C; --bad-soft:#3E1F1C; --info:#7DB0E0; --info-soft:#1A2B3C;
    --shadow:0 18px 50px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1412; --surface:#151F1C; --surface2:#1A2622; --line:#2A3833; --line2:#22302B;
  --text:#E3ECE7; --muted:#9BAAA3; --faint:#6F7F78;
  --ink:#09100E; --ink2:#12201C; --ink-text:#DCE9E3; --ink-muted:#7E978E;
  --btn:#E2AA3E; --btn-text:#1A1406; --accent:#E2AA3E; --accent-soft:#3A2F17;
  --c-cozinha:#E57450; --c-bar:#3BA9BB; --c-adega:#CB5E90;
  --ok:#5DBB82; --ok-soft:#18342A; --warn:#E0A94A; --warn-soft:#3A2E16; --bad:#EE7A6C; --bad-soft:#3E1F1C; --info:#7DB0E0; --info-soft:#1A2B3C;
  --shadow:0 18px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;text-wrap:balance;margin:0}
.num,td.r,.tiles b{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:var(--ink-text);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 16px;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .mk{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#1A1406;font-family:var(--display);font-weight:700;font-size:17px}
.brand b{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand small{display:block;color:var(--ink-muted);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;color:var(--ink-muted);font-weight:500}
.nav:hover{background:var(--ink2);color:var(--ink-text)}
.nav.on{background:var(--ink2);color:var(--ink-text);box-shadow:inset 3px 0 0 var(--accent)}
.nav:focus-visible{outline:2px solid var(--accent)}
.nav .ct{background:var(--accent);color:#1A1406;border-radius:20px;font-size:11px;font-weight:700;padding:1px 7px}
.navsep{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-muted);opacity:.7;padding:12px 10px 4px}
.who{display:flex;align-items:center;gap:9px;padding:10px 8px 0;border-top:1px solid var(--ink2)}
.who img{width:30px;height:30px;border-radius:50%}
.who div{flex:1;min-width:0}
.who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--ink-muted);font-size:11.5px}
.who button{all:unset;cursor:pointer;font-size:12px;color:var(--ink-muted);padding:4px 6px;border-radius:6px}
.who button:hover{color:var(--ink-text);background:var(--ink2)}
.main{padding:28px 32px 60px;min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.side .top{display:contents}.side nav{order:2}.who{order:3}
.nav{position:relative;justify-content:flex-start}
.nav .ni{width:18px;height:18px;flex:none;display:grid;place-items:center}
.nav .ni svg{width:18px;height:18px}
.nav .nl{flex:1}
.nav .ns{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:196px minmax(0,1fr)}
  .side{padding:18px 10px 14px}
  .brand small{display:none}
  .main{padding:20px 18px 60px}
}
@media (max-width:640px){
  .shell{grid-template-columns:70px minmax(0,1fr)}
  .side{padding:12px 6px;gap:12px}
  .brand{justify-content:center;padding:0}
  .brand>div:last-child,.navsep,.who div,.who img{display:none}
  .side nav{gap:4px}
  .nav{flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:9px 2px;text-align:center}
  .nav .nl{display:none}
  .nav .ns{display:block;font-size:10px;line-height:1.1;font-weight:600;letter-spacing:.01em}
  .nav.on{box-shadow:inset 3px 0 0 var(--accent)}
  .nav .ct{position:absolute;top:3px;right:5px;font-size:10px;padding:0 5px}
  .who{justify-content:center;padding:8px 0 0}
  .who button{font-size:11px}
  .main{padding:16px 16px 60px}
}

/* headings */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-size:28px;font-weight:700}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
h2.sec{font-size:17px;font-weight:600;margin-top:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:15.5px;font-weight:600}
.panel .sub{color:var(--muted);font-size:13px;margin:-6px 0 0}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.half{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.two,.half{grid-template-columns:minmax(0,1fr)}}

/* buttons */
.btn{appearance:none;border:1px solid transparent;background:var(--btn);color:var(--btn-text);font-weight:600;padding:9px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2);filter:none}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.lnk{all:unset;cursor:pointer;color:var(--info);font-weight:600}
.lnk:hover{text-decoration:underline}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.tile span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tile b{font-family:var(--display);font-size:25px;font-weight:700;letter-spacing:-.02em}
.tile small{color:var(--muted)}
.tile.ok b{color:var(--ok)} .tile.warn b{color:var(--warn)} .tile.bad b{color:var(--bad)}

/* CMC cards */
.cmc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.cmc-grid{grid-template-columns:minmax(0,1fr)}}
.cmc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--sc)}
.cmc header{display:flex;align-items:center;gap:8px;font-weight:600}
.cmc header .pill{margin-left:auto}
.cmc .big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em}
.cmc .big small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.meter{position:relative;height:8px;background:var(--line2);border-radius:6px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--sc)}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:2px}
.cmc dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0;font-size:13.5px}
.cmc dt{color:var(--muted)} .cmc dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.cmc dt.eq,.cmc dd.eq{color:var(--text);font-weight:700;border-top:1px solid var(--line2);padding-top:4px}
.s-cozinha{--sc:var(--c-cozinha)} .s-bar{--sc:var(--c-bar)} .s-adega{--sc:var(--c-adega)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sc);display:inline-block;flex:none}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.sp{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface2)}
.r{text-align:right} .c{text-align:center}
td small,.muted{color:var(--muted)}
td .nm{font-weight:600}
tr.grp td{background:var(--surface2);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
tfoot td{font-weight:700;background:var(--surface2);border-top:1px solid var(--line)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* forms */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.fld small{color:var(--faint);font-size:12px}
input[type=text],input[type=date],input[type=month],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2,.grid3,.grid4{grid-template-columns:minmax(0,1fr)}}
.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13.5px}
.chk input{width:16px;height:16px;accent-color:var(--btn)}
.w-s{max-width:110px} .w-m{max-width:190px}
.in-num{text-align:right;font-variant-numeric:tabular-nums}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--text);border-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent)}

/* banners */
.note{border-radius:10px;padding:10px 14px;background:var(--accent-soft);color:var(--text);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.note.info{background:var(--info-soft)}
.note.bad{background:var(--bad-soft)}
.note b{font-weight:700}

/* attention */
.att{display:flex;flex-direction:column;gap:2px}
.att .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.att .row:last-child{border:0}
.att h4{margin:10px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .gl{stroke:var(--line2)}
.f-cozinha{fill:var(--c-cozinha)} .f-bar{fill:var(--c-bar)} .f-adega{fill:var(--c-adega)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* start cards */
.starts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.starts{grid-template-columns:minmax(0,1fr)}}
.start{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px;border-left:4px solid var(--sc)}
.start:hover{border-color:var(--sc)}
.start:focus-visible{outline:2px solid var(--accent)}
.start b{font-family:var(--display);font-size:19px}
.start small{color:var(--muted)}
.g-estoque{--sc:var(--c-cozinha)} .g-soft{--sc:var(--c-bar)} .g-adega{--sc:var(--c-adega)}

/* count */
.cnt-in{width:110px;font-size:17px;text-align:right;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums}
.cnt-in.done{border-color:var(--ok);background:var(--ok-soft)}
.stickybar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 -6px 24px rgba(0,0,0,.06);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.stickybar .grow{flex:1;min-width:160px;color:var(--muted);font-size:13.5px}
.diff-pos{color:var(--ok);font-weight:600} .diff-neg{color:var(--bad);font-weight:600}

/* fichas cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fcard{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fcard:hover{border-color:var(--sc)}
.fcard:focus-visible{outline:2px solid var(--accent)}
.fcard h4{margin:0;font-family:var(--display);font-size:17px;font-weight:600}
.fcard .kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.fcard .kv b{color:var(--text);font-variant-numeric:tabular-nums}

/* calc */
.calc-out{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.calc-out{grid-template-columns:repeat(2,minmax(0,1fr))}}
.calc-out div{background:var(--surface2);border-radius:10px;padding:12px}
.calc-out span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.calc-out b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}

/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(8,20,16,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(720px,100%);height:100%;overflow:auto;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:2}
.drawer header h2{font-size:20px}
.drawer .body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
.drawer footer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.drawer footer .sp1{margin-right:auto}
.x{all:unset;cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;border-radius:6px;color:var(--muted)}
.x:hover{background:var(--surface2)}
.modal-ov{position:fixed;inset:0;background:rgba(8,20,16,.5);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:460px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.modal h3{font-size:18px}
.modal p{margin:0;color:var(--muted)}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
.summary div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.summary span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.summary b{font-size:18px;font-variant-numeric:tabular-nums}
.linetbl td{padding:6px 8px}
.linetbl select{min-width:180px}
.linetbl input{min-width:70px}

/* dashboard moderno */
:root{--sh1:0 1px 2px rgba(16,40,34,.05),0 12px 32px -20px rgba(16,40,34,.28)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sh1:0 1px 2px rgba(0,0,0,.35),0 12px 32px -20px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--sh1:0 1px 2px rgba(0,0,0,.35),0 12px 32px -20px rgba(0,0,0,.6)}
.dh{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.dh .eyebrow{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.dh h1{font-size:30px;font-weight:700;margin-top:2px}
.dh .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* Adaptador: fora do Claude, o banco é o Supabase (compartilhado) ou o navegador (local). */
(function(){
  if(window.claude&&window.claude.use)return;
  const cfg=window.MP_CONFIG||{};
  function makeDB(backend){
    const cache={},subs=[],ready={};
    const docSnap=(c,id)=>{const d=cache[c]&&cache[c].get(id);return{id,exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}};
    const colSnap=c=>{const docs=[...(cache[c]||new Map())].map(([id,d])=>({id,exists:true,data:()=>d}));return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}};
    const emit=c=>subs.filter(s=>s.col===c).forEach(s=>{try{s.fn(s.doc?docSnap(c,s.doc):colSnap(c))}catch(e){console.error(e)}});
    const init=c=>ready[c]||(ready[c]=backend.load(c).then(m=>{cache[c]=m;emit(c)}).catch(e=>{console.error('Erro ao carregar',c,e);cache[c]=new Map();emit(c)}));
    backend.onChange((c,id,data)=>{if(!cache[c])return;if(data==null)cache[c].delete(id);else cache[c].set(id,data);emit(c)});
    const sub=(c,doc,fn)=>{const s={col:c,doc,fn};subs.push(s);if(cache[c])setTimeout(()=>fn(doc?docSnap(c,doc):colSnap(c)));init(c);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}};
    const ref=(c,id)=>({id,path:c+'/'+id,
      get:async()=>{await init(c);return docSnap(c,id)},
      set:async d=>{const v=JSON.parse(JSON.stringify(d));await backend.set(c,id,v);(cache[c]=cache[c]||new Map()).set(id,v);emit(c)},
      update:async d=>{await init(c);const cur=cache[c].get(id);if(!cur)throw{code:'invalid_argument',message:'Documento não existe'};const v={...cur,...JSON.parse(JSON.stringify(d))};await backend.set(c,id,v);cache[c].set(id,v);emit(c)},
      delete:async()=>{await backend.del(c,id);if(cache[c])cache[c].delete(id);emit(c)},
      onSnapshot:(fn)=>sub(c,id,fn)});
    return{collection:c=>({path:c,doc:id=>ref(c,id||(Date.now().toString(36)+Math.random().toString(36).slice(2,8))),onSnapshot:fn=>sub(c,null,fn),get:async()=>{await init(c);return colSnap(c)}}),
      doc:p=>{const [c,id]=p.split('/');return ref(c,id)}};
  }
  function supaBackend(){
    const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const T=cfg.tabela||'mp_docs';let cb=()=>{};
    const err=e=>({code:'unavailable',message:'Erro no banco de dados: '+(e&&e.message||e)});
    sb.channel('mp-docs').on('postgres_changes',{event:'*',schema:'public',table:T},p=>{if(p.eventType==='DELETE'){if(p.old&&p.old.col)cb(p.old.col,p.old.id,null)}else if(p.new)cb(p.new.col,p.new.id,p.new.data)}).subscribe();
    return{onChange:f=>cb=f,
      load:async c=>{const m=new Map();let from=0;for(;;){const {data,error}=await sb.from(T).select('id,data').eq('col',c).range(from,from+999);if(error)throw err(error);data.forEach(r=>m.set(r.id,r.data));if(data.length<1000)break;from+=1000}return m},
      set:async(c,id,data)=>{const {error}=await sb.from(T).upsert({col:c,id,data,updated_at:new Date().toISOString()});if(error)throw err(error)},
      del:async(c,id)=>{const {error}=await sb.from(T).delete().eq('col',c).eq('id',id);if(error)throw err(error)}};
  }
  function localBackend(){
    const K='mise-en-place-db';const read=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return{}}};
    const write=db=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){throw{code:'quota_exceeded',message:'Sem espaço no navegador para salvar.'}}};
    let cb=()=>{};window.addEventListener('storage',e=>{if(e.key!==K)return;const db=read();for(const c in db)for(const id in db[c])cb(c,id,db[c][id])});
    return{onChange:f=>cb=f,load:async c=>new Map(Object.entries(read()[c]||{})),
      set:async(c,id,data)=>{const db=read();(db[c]=db[c]||{})[id]=data;write(db)},
      del:async(c,id)=>{const db=read();if(db[c])delete db[c][id];write(db)}};
  }
  const usaSupa=!!(cfg.supabaseUrl&&cfg.supabaseAnonKey&&window.supabase);
  window.MP_MODO=usaSupa?'supabase':'local';
  const db=makeDB(usaSupa?supaBackend():localBackend());
  const downloads={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return{status:'saved'}}};
  window.claude={use:async n=>n==='db'?db:n==='downloads'?downloads:null};
})();
</script>
<script>
/* ================= constantes & utilidades ================= */
const SETORES=[['cozinha','Cozinha'],['bar','Bar'],['adega','Adega']];
const SETOR_N={cozinha:'Cozinha',bar:'Bar',adega:'Adega'};
const GRUPOS=[['estoque','Estoque geral'],['soft','Soft'],['adega','Adega']];
const GRUPO_N=Object.fromEntries(GRUPOS);
const UNIDADES=['kg','g','L','ml','un','cx','fd','gf','pct','dz','maço'];
const TIPOS_F=[['prato','Prato'],['drink','Drink / bebida'],['producao','Produção (base / pré-preparo)']];
const COLS=['produtos','fichas','producoes','contagens','compras','faturamento','inventarios','cotacoes','fornecedores'];
const NAV=[
  {k:'painel',n:'Painel',s:'Painel',i:'grid'},
  {sep:'Operação'},
  {k:'estoque',n:'Estoque',s:'Estoque',i:'box'},
  {k:'contagens',n:'Contagens',s:'Contagens',i:'list'},
  {k:'producao',n:'Cozinha de produção',s:'Produção',i:'pot'},
  {k:'fichas',n:'Fichas técnicas',s:'Fichas',i:'file'},
  {sep:'Gestão',admin:1},
  {k:'planilha',n:'Planilha de compras',s:'Planilha',i:'sheet',admin:1},
  {k:'cotacoes',n:'Cotações',s:'Cotação',i:'scale',admin:1},
  {k:'compras',n:'Compras',s:'Compras',i:'cart',admin:1},
  {k:'faturamento',n:'Faturamento & CMC',s:'Faturam.',i:'trend',admin:1},
  {k:'inventarios',n:'Inventários',s:'Inventário',i:'flag',admin:1},
  {k:'ajustes',n:'Ajustes',s:'Ajustes',i:'sliders',admin:1},
];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl=n=>BRL.format(+n||0);
const brlK=n=>{n=+n||0;return Math.abs(n)>=1000?'R$ '+(n/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':brl(n)};
const nf=(n,d=3)=>(+n||0).toLocaleString('pt-BR',{maximumFractionDigits:d});
const pct=n=>isFinite(n)?(n*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%':'—';
function pn(v){if(typeof v==='number')return isFinite(v)?v:0;if(v==null)return 0;let s=String(v).trim().replace(/\s|R\$|%/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0}
const numStr=n=>(n==null||n==='')?'':String(Math.round((+n||0)*1000)/1000).replace('.',',');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
function hoje(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDias(iso,n){const [y,m,d]=iso.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d+n));return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate())}
function diasMes(ym){const [y,m]=ym.split('-').map(Number);return new Date(Date.UTC(y,m,0)).getUTCDate()}
function difDias(a,b){const f=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((f(b)-f(a))/864e5)}
const fdt=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'—';
const fdm=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7):'';
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const nomeMes=ym=>MESES[+ym.slice(5,7)-1]+' de '+ym.slice(0,4);
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const zero=()=>({cozinha:0,bar:0,adega:0});
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?undefined:a[k],o)}
function setPath(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]={};a=a[ks[i]]}a[ks.at(-1)]=v}
const fid=b=>'f-'+b.replace(/[^a-zA-Z0-9]/g,'-');

/* ================= estado ================= */
const S={db:null,user:null,dl:null,local:false,booted:false,canAdmin:true,role:null,me:null,view:'painel',names:{},
  d:{produtos:[],fichas:[],producoes:[],contagens:[],compras:[],faturamento:[],inventarios:[],cotacoes:[],fornecedores:[]},
  cfg:{empresa:'',metas:{cozinha:30,bar:25,adega:35},projecao:{cozinha:0,bar:0,adega:0},custoMetodo:'medio'},
  sen:{adm:null,equipe:null},senL:{adm:false,equipe:false},
  ui:{login:{role:null,pw:'',err:'',busy:false,tries:0,lock:0},setup:{a1:'',a2:'',e1:'',e2:'',err:'',busy:false},pwf:{a1:'',a2:'',e1:'',e2:''},dash:'30',tab:{producao:'registrar',compras:'orcamento'},est:{busca:'',setor:'',grupo:'',baixo:false},fch:{tipo:'',busca:''},
    pl:{q:{},setor:'',modo:'minimo'},calc:{bruto:'10',limpo:'7,2',preco:'42',precisa:'5'},
    pr:{fichaId:'',lotes:'1',real:'',data:hoje(),obs:''},fat:null,fatMes:hoje().slice(0,7),orcMes:hoje().slice(0,7),

function nomeUser(id){if(!id)return '—';if(S.me&&id===S.me.id)return 'Você';return S.names[id]||'Equipe'}

/* ================= dados ================= */
function errMsg(e){const c=e&&e.code;if(c==='invalid_argument')return 'Não foi possível salvar: seu acesso não permite esta alteração (ou o dado é inválido).';if(c==='quota_exceeded')return 'O banco atingiu o limite de registros. Apague registros antigos em Ajustes.';if(c==='resource_exhausted')return 'Muitas alterações ao mesmo tempo. Aguarde alguns segundos e tente de novo.';if(c==='revoked'||c==='not_granted')return 'Seu acesso a este sistema mudou. Recarregue a página.';return (e&&e.message)||'Algo deu errado ao salvar. Tente de novo.'}
function clean(o){return JSON.parse(JSON.stringify(o))}
async function put(col,obj){
  const {id,...rest}=obj;rest.atualizadoEm=new Date().toISOString();
  if(S.db){await S.db.collection(col).doc(id).set(clean(rest))}
  else{const a=S.d[col];const i=a.findIndex(x=>x.id===id);const full={id,...clean(rest)};if(i>=0)a[i]=full;else a.push(full);schedule()}
}
async function del(col,id){if(S.db)await S.db.collection(col).doc(id).delete();else{S.d[col]=S.d[col].filter(x=>x.id!==id);schedule()}}
async function saveCfg(c){if(S.db)await S.db.doc('config/geral').set(clean(c));else{S.cfg=c;schedule()}}
async function run(fn,ok){try{await fn();if(ok)toast(ok)}catch(e){console.error(e);toast(typeof e==='string'?e:errMsg(e),true)}}
function mergeCfg(c){const d=S.cfg;return{empresa:c.empresa||'',metas:{...d.metas,...(c.metas||{})},projecao:{...d.projecao,...(c.projecao||{})},custoMetodo:c.custoMetodo||'medio'}}
let nameBusy=false;
async function refreshNames(){if(!S.user||nameBusy)return;const ids=[...new Set([...S.d.contagens,...S.d.producoes,...S.d.inventarios].map(x=>x.por).filter(Boolean))].filter(i=>!(i in S.names));if(!ids.length)return;nameBusy=true;try{const ps=await S.user.profiles(ids);for(const i of ids)S.names[i]=(ps[i]&&ps[i].name)||''}catch(e){}nameBusy=false;schedule()}
function subscribe(){
  for(const c of COLS){S.db.collection(c).onSnapshot(s=>{S.d[c]=s.docs.map(d=>({id:d.id,...d.data()}));schedule();if(c==='contagens'||c==='producoes'||c==='inventarios')refreshNames()},e=>console.warn(c,e))}
  for(const k of ['adm','equipe'])S.db.doc('senhas/'+k).onSnapshot(x=>{S.sen[k]=x.exists?x.data():null;S.senL[k]=true;schedule()},e=>{S.senL[k]=true;schedule()});
  S.db.doc('config/geral').onSnapshot(s=>{if(s.exists){S.cfg=mergeCfg(s.data());schedule()}},e=>console.warn('config',e));
}

/* ================= cálculos ================= */
function valorSetor(prods){const v=zero();for(const p of prods){if(p.ativo===false)continue;v[p.setor]=(v[p.setor]||0)+Math.max(0,+p.qtd||0)*(+p.custo||0)}return v}
const inR=(d,a,b)=>(!a||d>=a)&&(!b||d<=b);
function compraSet(c){const v=zero();for(const it of c.itens||[]){const s=it.setor||(P(it.produtoId)||{}).setor||'cozinha';v[s]=(v[s]||0)+(+it.qtd||0)*(+it.valor||0)}return v}
function somaCompras(a,b,status='recebida'){const v=zero();for(const c of S.d.compras){if(status&&c.status!==status)continue;if(!inR(c.data,a,b))continue;const x=compraSet(c);for(const k in v)v[k]+=x[k]}return v}
function somaFat(a,b){const v=zero();for(const f of S.d.faturamento){if(!inR(f.data,a,b))continue;for(const k in v)v[k]+=+f[k]||0}return v}
function invs(){return [...S.d.inventarios].sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:String(a.criadoEm||'').localeCompare(String(b.criadoEm||'')))}
function montaCMC(EI,C,EF,F){const r={};let t={ei:0,c:0,ef:0,cmc:0,fat:0};for(const [k] of SETORES){const cmc=(EI[k]||0)+(C[k]||0)-(EF[k]||0);r[k]={ei:EI[k]||0,c:C[k]||0,ef:EF[k]||0,cmc,fat:F[k]||0,p:F[k]>0?cmc/F[k]:NaN};for(const x of ['ei','c','ef','cmc','fat'])t[x]+=r[k][x]}t.p=t.fat>0?t.cmc/t.fat:NaN;r.total=t;return r}
function cmcAtual(){const inv=invs().at(-1);const EI=inv?inv.valores||zero():zero();const from=inv?addDias(inv.data,1):null;return{inv,r:montaCMC(EI,somaCompras(from,null),valorSetor(S.d.produtos),somaFat(from,null))}}
function metaDe(k){return +S.cfg.metas[k]||0}
function metaPond(r){const f=sum(SETORES,([k])=>r[k].fat);return f?sum(SETORES,([k])=>r[k].fat*metaDe(k))/f:(metaDe('cozinha')+metaDe('bar')+metaDe('adega'))/3}
function st(p,meta){if(!isFinite(p))return'';const v=p*100;return v<=meta?'ok':v<=meta+3?'warn':'bad'}
const stLabel={ok:'Dentro da meta',warn:'Atenção',bad:'Acima da meta','':'Sem faturamento'};
function abaixoMin(){return ativos().filter(p=>(+p.minimo||0)>0&&(+p.qtd||0)<(+p.minimo||0))}
function fichaCalc(f){const itens=(f.itens||[]).map(it=>{const p=P(it.produtoId);const q=pn(it.qtd),fc=pn(it.fc)||1;return{p,q,fc,bruto:q*fc,custo:q*fc*(p?+p.custo||0:0)}});const custo=sum(itens,i=>i.custo);const por=pn(f.porcoes)||1;const preco=pn(f.preco);const cp=custo/por;return{itens,custo,cp,preco,cmv:preco>0?cp/preco:NaN}}
function metaFicha(f){return metaDe(f.setor||'cozinha')}

/* ================= render ================= */
let rq=false;function schedule(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}
function render(){
  const a=document.activeElement;const id=a&&a.id;let s0=null,s1=null;try{s0=a.selectionStart;s1=a.selectionEnd}catch(e){}
  const dsc=document.querySelector('.drawer')?.scrollTop;
  const root=document.getElementById('app');
  root.innerHTML=!S.booted?'<div class="loading">Carregando…</div>':S.role?shell():vLogin();
  if(dsc!=null){const d=document.querySelector('.drawer');if(d)d.scrollTop=dsc}
  if(id){const el=document.getElementById(id);if(el&&el!==document.activeElement){el.focus({preventScroll:true});try{if(s0!=null)el.setSelectionRange(s0,s1)}catch(e){}}}
}
let tT;function toast(m,err){const t=document.getElementById('toast');t.textContent=m;t.className='toast'+(err?' err':'');t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,err?5200:2600)}

function sel(b,opts,o={}){const v=getPath(S.ui,b)??'';return `<select id="${fid(b)}" data-bind="${b}" class="${o.cls||''}" ${o.dis?'disabled':''}>${opts.map(([k,n])=>`<option value="${esc(k)}" ${String(k)===String(v)?'selected':''}>${esc(n)}</option>`).join('')}</select>`}
function chk(b,label){return `<label class="chk"><input type="checkbox" id="${fid(b)}" data-bind="${b}" ${getPath(S.ui,b)?'checked':''}> ${label}</label>`}
function fld(label,html,hint){return `<label class="fld"><span>${label}</span>${html}${hint?`<small>${hint}</small>`:''}</label>`}
function ph(t,sub,acts=''){return `<div class="ph"><div><h1>${t}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="acts">${acts}</div></div>`}
const sp=k=>`<span class="sp s-${k}"><span class="dot"></span>${SETOR_N[k]||k}</span>`;
const tile=(l,v,s,c='')=>`<div class="tile ${c}"><span>${l}</span><b>${v}</b>${s?`<small>${s}</small>`:''}</div>`;
function tabs(key,list){return `<div class="tabs" role="tablist">${list.map(([k,n])=>`<button class="tab ${S.ui.tab[key]===k?'on':''}" role="tab" aria-selected="${S.ui.tab[key]===k}" data-act="tab" data-g="${key}" data-k="${k}">${n}</button>`).join('')}</div>`}

  <dl><dt>Estoque inicial</dt><dd>${brl(x.ei)}</dd><dt>+ Compras</dt><dd>${brl(x.c)}</dd><dt>− Estoque atual</dt><dd>${brl(x.ef)}</dd><dt class="eq">= CMC</dt><dd class="eq">${brl(x.cmc)}</dd><dt>Faturamento</dt><dd>${brl(x.fat)}</dd></dl></article>`}
function atencao(){const b=abaixoMin().sort((a,c)=>(a.qtd/a.minimo)-(c.qtd/c.minimo));const pend=S.d.contagens.filter(c=>c.status==='enviada');const ped=S.d.compras.filter(c=>c.status==='pedido');
  if(!b.length&&!pend.length&&!ped.length)return `<div class="empty">Tudo em ordem por aqui.</div>`;

  return h+'</div>'}

function chartFat(n,mes){
  let dias=[];if(mes){const dm=diasMes(mes);for(let i=1;i<=dm;i++)dias.push(mes+'-'+pad(i))}else{const h=hoje();for(let i=n-1;i>=0;i--)dias.push(addDias(h,-i))}
  const m=Object.fromEntries(S.d.faturamento.map(f=>[f.data,f]));
  const rows=dias.map(d=>{const f=m[d]||{};return{d,c:+f.cozinha||0,b:+f.bar||0,a:+f.adega||0}});
  const mx=Math.max(1,...rows.map(r=>r.c+r.b+r.a));const step=niceStep(mx/4);const top=Math.ceil(mx/step)*step;
  const W=760,H=230,pl=70,pr=8,pt=10,pb=26,iw=W-pl-pr,ih=H-pt-pb,bw=iw/rows.length;const y=v=>pt+ih-(v/top)*ih;
  let g='';for(let v=0;v<=top+1e-6;v+=step){g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${brlK(v)}</text>`}
  let bars='';rows.forEach((r,i)=>{const x=pl+i*bw+bw*.16,w=bw*.68;let base=0;for(const [k,v] of [['cozinha',r.c],['bar',r.b],['adega',r.a]]){if(v>0){bars+=`<rect class="f-${k}" x="${x.toFixed(1)}" y="${y(base+v).toFixed(1)}" width="${w.toFixed(1)}" height="${(y(base)-y(base+v)).toFixed(1)}"><title>${fdt(r.d)} · ${SETOR_N[k]}: ${brl(v)}</title></rect>`}base+=v}
    const every=Math.ceil(rows.length/8);if(i%every===0)bars+=`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${fdm(r.d)}</text>`});
  const tot=sum(rows,r=>r.c+r.b+r.a);
  return `<div class="chart">${tot?`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento diário por setor">${g}${bars}</svg>`:'<div class="empty">Nenhum faturamento lançado neste período.</div>'}</div>
  <div class="legend">${SETORES.map(([k,n])=>`<span class="s-${k}"><span class="dot"></span>${n} ${brl(sum(rows,r=>k==='cozinha'?r.c:k==='bar'?r.b:r.a))}</span>`).join('')}</div>`}
function niceStep(x){if(x<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(x)));const f=x/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}

/* ---------- Estoque ---------- */
V.estoque=()=>{const u=S.ui.est;const q=u.busca.trim().toLowerCase();
  let list=S.d.produtos.filter(p=>(!u.setor||p.setor===u.setor)&&(!u.grupo||p.grupo===u.grupo)&&(!q||(p.nome+' '+(p.categoria||'')+' '+(p.fornecedor||'')).toLowerCase().includes(q))&&(!u.baixo||((+p.minimo||0)>0&&(+p.qtd||0)<(+p.minimo||0))));
  list.sort((a,b)=>(a.setor+(a.categoria||'')+a.nome).localeCompare(b.setor+(b.categoria||'')+b.nome));
  const v=valorSetor(S.d.produtos);
  return `${ph('Estoque',`${ativos().length} produtos · ${brl(v.cozinha+v.bar+v.adega)} em estoque`,io('estoque','produtos')+(isAdmin()?`<button class="btn" data-act="prodNovo">+ Novo produto</button>`:''))}

V.contagens=()=>{if(S.ui.ct)return contagemTela();
  const list=[...S.d.contagens].sort((a,b)=>(b.data+(b.atualizadoEm||'')).localeCompare(a.data+(a.atualizadoEm||'')));
  const lbl={rascunho:['','Rascunho'],enviada:['warn','Aguardando aprovação'],aplicada:['ok','Aplicada ao estoque']};
  return `${ph('Contagens','Conte o estoque geral, o soft e a adega. '+(isAdmin()?'Revise as contagens enviadas e aplique ao estoque.':'Ao terminar, envie para aprovação.'),io('contagens','contagem'))}
  <div class="starts">${GRUPOS.map(([g,n])=>`<button class="start g-${g}" data-act="ctNova" data-g="${g}"><b>Contar ${n}</b><small>${ativos().filter(p=>p.grupo===g).length} itens · última: ${ultimaCont(g)}</small></button>`).join('')}</div>
  <div class="tw"><table><thead><tr><th>Data</th><th>Contagem</th><th>Feita por</th><th class="r">Itens contados</th><th class="r">Divergência (R$)</th><th>Status</th><th></th></tr></thead><tbody>
  ${list.map(c=>{const d=divergencia(c.grupo,c.itens||{});const L=lbl[c.status]||['',c.status];
    return `<tr><td>${fdt(c.data)}</td><td>${GRUPO_N[c.grupo]||c.grupo}</td><td>${esc(nomeUser(c.por))}</td><td class="r">${Object.keys(c.itens||{}).length} / ${ativos().filter(p=>p.grupo===c.grupo).length}</td>
    <td class="r ${c.status==='aplicada'?'':(d.val<0?'diff-neg':d.val>0?'diff-pos':'')}">${c.status==='aplicada'?'<small>aplicada</small>':brl(d.val)}</td><td><span class="pill ${L[0]}">${L[1]}</span></td>
    <td class="r"><button class="btn ghost sm" data-act="ctAbrir" data-id="${c.id}">${c.status==='aplicada'?'Ver':isAdmin()&&c.status==='enviada'?'Revisar':'Abrir'}</button></td></tr>`}).join('')||`<tr><td colspan="7" class="empty">Nenhuma contagem ainda. Escolha acima o que contar.</td></tr>`}
  </tbody></table></div>`};
function ultimaCont(g){const c=S.d.contagens.filter(x=>x.grupo===g&&x.status==='aplicada').sort((a,b)=>b.data.localeCompare(a.data))[0];return c?fdt(c.data):'nunca'}
function divergencia(g,itens){let val=0,n=0;for(const [pid,v] of Object.entries(itens)){const p=P(pid);if(!p||String(v).trim()==='')continue;const d=pn(v)-(+p.qtd||0);if(Math.abs(d)>1e-9){n++;val+=d*(+p.custo||0)}}return{val,n}}
function contagemTela(){const c=S.ui.ct;const ro=c.status==='aplicada'||(!isAdmin()&&c.status==='enviada');const q=(c.busca||'').trim().toLowerCase();
  const itens=ativos().filter(p=>p.grupo===c.grupo).sort((a,b)=>((a.categoria||'')+a.nome).localeCompare((b.categoria||'')+b.nome));
  const vis=itens.filter(p=>!q||(p.nome+' '+(p.categoria||'')).toLowerCase().includes(q));
  const mostra=isAdmin()&&!c.cega;let cat=null;
  const rows=vis.map(p=>{let h='';if((p.categoria||'Outros')!==cat){cat=p.categoria||'Outros';h+=`<tr class="grp"><td colspan="${mostra?5:3}">${esc(cat)}</td></tr>`}
    const v=c.itens[p.id]??'';const done=String(v).trim()!=='';
    h+=`<tr><td><div class="nm">${esc(p.nome)}</div><small>${sp(p.setor)}</small></td><td>${esc(p.unidade)}</td>
    <td class="r"><input class="cnt-in ${done?'done':''}" id="ct-${p.id}" data-ct="${p.id}" inputmode="decimal" autocomplete="off" value="${esc(v)}" ${ro?'disabled':''} aria-label="Quantidade contada de ${esc(p.nome)}"></td>
    ${mostra?`<td class="r">${nf(p.qtd)}</td><td class="r" id="df-${p.id}">${diffCell(p,v)}</td>`:''}</tr>`;return h}).join('');
  const nC=itens.filter(p=>String(c.itens[p.id]??'').trim()!=='').length;const dv=divergencia(c.grupo,c.itens);
  return `${ph(`Contagem · ${GRUPO_N[c.grupo]}`,`${fdt(c.data)}${c.por?' · '+esc(nomeUser(c.por)):''}${ro?' · somente leitura':''}`,io('contagem')+`<button class="btn ghost" data-act="ctFechar">← Voltar</button>`)}
  <div class="bar">${fld('Buscar item',`<input type="search" id="ct-busca" data-bind="ct.busca" value="${esc(c.busca||'')}" placeholder="Digite para filtrar">`)}
   ${fld('Data da contagem',`<input type="date" id="ct-data" data-bind="ct.data" value="${esc(c.data)}" ${ro?'disabled':''}>`)}
   ${ro||!isAdmin()?'':`<div style="padding-bottom:8px">${chk('ct.cega','Contagem cega (esconder saldo do sistema)')}</div>`}</div>
  <div class="tw"><table><thead><tr><th>Item</th><th>Un.</th><th class="r">Contado</th>${mostra?'<th class="r">Sistema</th><th class="r">Diferença</th>':''}</tr></thead><tbody>${rows||`<tr><td colspan="5" class="empty">Nenhum item neste grupo. Cadastre produtos em Estoque.</td></tr>`}</tbody></table></div>
  ${ro?'':`<div class="stickybar"><div class="grow" id="ct-prog">${progTxt(nC,itens.length,dv)}</div>
   <button class="btn ghost" data-act="ctSalvar" data-s="rascunho">Salvar rascunho</button>
   ${isAdmin()?`<button class="btn" data-act="ctAplicar">Aplicar ao estoque</button>`:`<button class="btn" data-act="ctSalvar" data-s="enviada">Enviar para aprovação</button>`}
   ${!c.nova&&isAdmin()?`<button class="btn danger" data-act="ctExcluir">Excluir</button>`:''}</div>`}`}
function progTxt(n,t,dv){return `<b>${n} de ${t}</b> itens contados${isAdmin()&&!S.ui.ct.cega?` · divergência ${brl(dv.val)} em ${dv.n} ite${dv.n===1?'m':'ns'}`:''} · itens em branco não alteram o estoque`}
function diffCell(p,v){if(String(v).trim()==='')return '<span class="muted">—</span>';const d=pn(v)-(+p.qtd||0);if(Math.abs(d)<1e-9)return '<span class="muted">0</span>';return `<span class="${d>0?'diff-pos':'diff-neg'}">${d>0?'+':''}${nf(d)}</span> <small>${brl(d*(+p.custo||0))}</small>`}
function contInput(el){const pid=el.dataset.ct;S.ui.ct.itens[pid]=el.value;el.classList.toggle('done',el.value.trim()!=='');const p=P(pid);const df=document.getElementById('df-'+pid);if(df&&p)df.innerHTML=diffCell(p,el.value);
  const itens=ativos().filter(x=>x.grupo===S.ui.ct.grupo);const n=itens.filter(x=>String(S.ui.ct.itens[x.id]??'').trim()!=='').length;const pr=document.getElementById('ct-prog');if(pr)pr.innerHTML=progTxt(n,itens.length,divergencia(S.ui.ct.grupo,S.ui.ct.itens))}

/* ---------- Produção ---------- */
V.producao=()=>{const t=S.ui.tab.producao;
  return `${ph('Cozinha de produção','Registre as produções (baixa os insumos e dá entrada no item produzido) e calcule rendimento e fator de correção.',io('producao'))}
  ${tabs('producao',[['registrar','Registrar produção'],['calc','Calculadora de rendimento'],['hist','Histórico']])}
  ${t==='calc'?calcView():t==='hist'?prodHist():prodRegistrar()}`};
function prCalc(){const f=S.d.fichas.find(x=>x.id===S.ui.pr.fichaId);if(!f)return null;const L=pn(S.ui.pr.lotes);
  const itens=(f.itens||[]).map(it=>{const p=P(it.produtoId);const q=pn(it.qtd)*(pn(it.fc)||1)*L;return{p,it,q,custo:q*(p?+p.custo||0:0)}});
  const custo=sum(itens,i=>i.custo);const esperado=(+f.porcoes||0)*L;const real=pn(S.ui.pr.real);
  return{f,L,itens,custo,esperado,real,rend:esperado&&real?real/esperado:NaN,cu:real?custo/real:esperado?custo/esperado:NaN,prod:P(f.produtoId)}}
function prodRegistrar(){const fichas=S.d.fichas.filter(f=>f.tipo==='producao').sort((a,b)=>a.nome.localeCompare(b.nome));const r=prCalc();
  if(!fichas.length)return `<div class="panel"><div class="empty">Nenhuma ficha de produção cadastrada. ${isAdmin()?'Crie uma em Fichas técnicas com o tipo “Produção”.':'Peça à administração para cadastrar.'}</div></div>`;
  const un=r&&r.prod?r.prod.unidade:'';
  return `<div class="two"><section class="panel"><h3>Nova produção</h3>
   <div class="grid2">${fld('Receita de produção',sel('pr.fichaId',[['','Selecione…'],...fichas.map(f=>[f.id,f.nome])]))}${fld('Data',inp('pr.data',{type:'date'}))}</div>
   <div class="grid2">${fld('Quantidade de receitas (lotes)',inp('pr.lotes',{dec:1}),r?`1 lote rende ${nf(r.f.porcoes)} ${esc(un)}`:'')}${fld('Quantidade produzida (real)'+(un?' em '+esc(un):''),inp('pr.real',{dec:1,ph:r?numStr(r.esperado):''}),'Pese/meça o que saiu da produção')}</div>
   ${r?`<div class="tw"><table><thead><tr><th>Insumo</th><th class="r">Baixa (bruto)</th><th class="r">Em estoque</th><th class="r">Custo</th></tr></thead><tbody>
   ${r.itens.map(i=>`<tr><td>${esc(i.p?i.p.nome:'(produto removido)')}</td><td class="r">${nf(i.q)} ${esc(i.p?i.p.unidade:'')}</td><td class="r ${i.p&&i.p.qtd<i.q?'diff-neg':''}">${i.p?nf(i.p.qtd):'—'}</td><td class="r">${brl(i.custo)}</td></tr>`).join('')}
   </tbody><tfoot><tr><td colspan="3">Custo total da produção</td><td class="r">${brl(r.custo)}</td></tr></tfoot></table></div>`:''}
   ${fld('Observação',inp('pr.obs',{ph:'Opcional'}))}
   <div class="bar"><button class="btn" data-act="prSalvar" ${r?'':'disabled'}>Registrar produção</button></div></section>
   <section class="panel"><h3>Resultado</h3>${r?`<div class="calc-out" style="grid-template-columns:repeat(2,minmax(0,1fr))">
    <div><span>Rendimento esperado</span><b>${nf(r.esperado)} ${esc(un)}</b></div>
    <div><span>Rendimento real</span><b class="${!isFinite(r.rend)?'':r.rend<0.95?'diff-neg':'diff-pos'}">${isFinite(r.rend)?pct(r.rend):'—'}</b></div>
    <div><span>Custo por ${esc(un||'unidade')}</span><b>${isFinite(r.cu)?brl(r.cu):'—'}</b></div>
    <div><span>Custo cadastrado</span><b>${r.prod?brl(r.prod.custo):'—'}</b></div></div>
    <small class="muted">Ao registrar: os insumos saem do estoque, ${r.prod?`<b>${esc(r.prod.nome)}</b>`:'o item produzido'} entra com a quantidade real e o custo é atualizado (${S.cfg.custoMetodo==='medio'?'custo médio':'último custo'}).</small>`:'<div class="empty">Escolha uma receita de produção.</div>'}</section></div>`}
function prodHist(){const l=[...S.d.producoes].sort((a,b)=>(b.data+(b.atualizadoEm||'')).localeCompare(a.data+(a.atualizadoEm||'')));
  return `<div class="tw"><table><thead><tr><th>Data</th><th>Produção</th><th class="r">Lotes</th><th class="r">Esperado</th><th class="r">Real</th><th class="r">Rendimento</th><th class="r">Custo total</th><th class="r">Custo un.</th><th>Por</th></tr></thead><tbody>
  ${l.map(p=>{const u=(P(p.produtoId)||{}).unidade||'';return `<tr><td>${fdt(p.data)}</td><td class="nm">${esc(p.fichaNome||'')}</td><td class="r">${nf(p.lotes)}</td><td class="r">${nf(p.esperado)} ${esc(u)}</td><td class="r">${nf(p.real)} ${esc(u)}</td><td class="r"><span class="pill ${p.rendimento<0.95?'bad':p.rendimento<1?'warn':'ok'}">${pct(p.rendimento)}</span></td><td class="r">${brl(p.custoTotal)}</td><td class="r">${brl(p.custoUnit)}</td><td>${esc(nomeUser(p.por))}</td></tr>`}).join('')||`<tr><td colspan="9" class="empty">Nenhuma produção registrada.</td></tr>`}</tbody></table></div>`}
function calcView(){const c=S.ui.calc;const b=pn(c.bruto),l=pn(c.limpo),pr=pn(c.preco),need=pn(c.precisa);
  const rend=b>0?l/b:NaN,fc=l>0?b/l:NaN,perda=b>0?1-l/b:NaN,cr=l>0?pr*b/l:NaN;
  return `<div class="two"><section class="panel"><h3>Rendimento e fator de correção</h3><p class="sub">Pese o produto antes e depois da limpeza (ou cocção) para saber quanto realmente aproveita.</p>
   <div class="grid3">${fld('Peso bruto (kg)',inp('calc.bruto',{dec:1}))}${fld('Peso limpo / pronto (kg)',inp('calc.limpo',{dec:1}))}${fld('Preço pago por kg bruto',inp('calc.preco',{dec:1}))}</div>
   <div class="calc-out"><div><span>Rendimento</span><b>${pct(rend)}</b></div><div><span>Perda</span><b>${pct(perda)}</b></div><div><span>Fator de correção</span><b>${isFinite(fc)?nf(fc,3):'—'}</b></div><div><span>Custo real / kg limpo</span><b>${isFinite(cr)?brl(cr):'—'}</b></div></div>
   <small class="muted">FC = peso bruto ÷ peso limpo. Use esse FC nas fichas técnicas para o custo sair correto.</small></section>
   <section class="panel"><h3>Quanto comprar?</h3><p class="sub">Com o fator de correção ao lado, calcule o bruto necessário.</p>
   ${fld('Preciso de (kg limpos)',inp('calc.precisa',{dec:1}))}
   <div class="calc-out" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><span>Comprar (bruto)</span><b>${isFinite(fc)?nf(need*fc,2)+' kg':'—'}</b></div><div><span>Custo estimado</span><b>${isFinite(fc)?brl(need*fc*pr):'—'}</b></div></div></section></div>`}

/* ---------- Planilha de compras ---------- */
function plRows(){const u=S.ui.pl;return ativos().filter(p=>(!u.setor||p.setor===u.setor)&&(u.modo==='minimo'?(+p.minimo||0)>0&&(+p.qtd||0)<(+p.minimo||0):(+p.ideal||0)>0&&(+p.qtd||0)<(+p.ideal||0)))
  .map(p=>{let sug=Math.max(0,(+p.ideal||+p.minimo||0)-Math.max(0,+p.qtd||0));if(['un','cx','fd','gf','pct','dz','maço'].includes(p.unidade))sug=Math.ceil(sug);else sug=Math.ceil(sug*100)/100;
   const raw=u.q[p.id];const q=raw!=null?pn(raw):sug;return{p,sug,q,val:q*(+p.custo||0),forn:p.fornecedor||'Sem fornecedor'}})
  .sort((a,b)=>(a.forn+a.p.nome).localeCompare(b.forn+b.p.nome))}
V.planilha=()=>{const rows=plRows();const tot=sum(rows,r=>r.val);let fo=null;
  const body=rows.map(r=>{let h='';if(r.forn!==fo){fo=r.forn;const st2=sum(rows.filter(x=>x.forn===fo),x=>x.val);h+=`<tr class="grp"><td colspan="7">${esc(fo)} · ${brl(st2)}</td></tr>`}
   const v=S.ui.pl.q[r.p.id]??numStr(r.sug);
   return h+`<tr><td><div class="nm">${esc(r.p.nome)}</div><small>${sp(r.p.setor)}</small></td><td class="r">${nf(r.p.qtd)} ${esc(r.p.unidade)}</td><td class="r">${nf(r.p.minimo)} / ${nf(r.p.ideal)}</td><td class="r">${nf(r.sug)}</td>
   <td class="r"><input class="cnt-in" style="width:96px;font-size:15px" id="pl-${r.p.id}" data-bind="pl.q.${r.p.id}" inputmode="decimal" value="${esc(v)}" aria-label="Comprar ${esc(r.p.nome)}"></td><td class="r">${brl(r.p.custo)}</td><td class="r">${brl(r.val)}</td></tr>`}).join('');
  return `${ph('Planilha de compras','Sugestão automática para voltar ao estoque ideal. Ajuste as quantidades, copie para o WhatsApp, exporte em PDF ou Excel, importe listas de outro aplicativo ou gere os pedidos.',`<button class="btn ghost" data-act="plCopiar" ${rows.length?'':'disabled'}>Copiar lista</button>${io('planilha','compras')}<button class="btn ghost" data-act="cotNova" data-src="planilha" ${rows.length?'':'disabled'}>Fazer cotação</button><button class="btn" data-act="plPedidos" ${rows.length?'':'disabled'}>Gerar pedidos</button>`)}
  <div class="bar">${fld('Incluir itens',sel('pl.modo',[['minimo','Abaixo do mínimo'],['ideal','Abaixo do ideal']]))}${fld('Setor',sel('pl.setor',[['','Todos'],...SETORES]))}<div style="padding-bottom:8px"><button class="lnk" data-act="plReset">Restaurar sugestões</button></div></div>
  <section class="tiles">${tile('Itens na lista',rows.length)}${tile('Total estimado',brl(tot))}${tile('Fornecedores',new Set(rows.map(r=>r.forn)).size)}${(()=>{const o=orcamento(hoje().slice(0,7));const s=o.total.saldo;return tile('Saldo do orçamento do mês',brl(s),'após esta lista: '+brl(s-tot),s-tot<0?'bad':'ok')})()}</section>
  <div class="tw"><table><thead><tr><th>Produto</th><th class="r">Estoque</th><th class="r">Mín. / Ideal</th><th class="r">Sugerido</th><th class="r">Comprar</th><th class="r">Custo un.</th><th class="r">Total</th></tr></thead><tbody>${body||`<tr><td colspan="7" class="empty">Nenhum item precisa de reposição com esse filtro.</td></tr>`}</tbody>${rows.length?`<tfoot><tr><td colspan="6">Total estimado</td><td class="r">${brl(tot)}</td></tr></tfoot>`:''}</table></div>`};

/* ---------- Compras ---------- */
function orcamento(mes){const a=mes+'-01',b=mes+'-'+pad(diasMes(mes));const fat=somaFat(a,b),rec=somaCompras(a,b,'recebida'),ped=somaCompras(a,b,'pedido');
  const ult=S.d.faturamento.filter(f=>inR(f.data,a,b)).map(f=>+f.data.slice(8,10));const dd=ult.length?Math.max(...ult):0;const dm=diasMes(mes);
  const r={};const t={fat:0,proj:0,lim:0,rec:0,ped:0,saldo:0};
  for(const [k] of SETORES){const man=+S.cfg.projecao[k]||0;const proj=man>0?man:dd?fat[k]/dd*dm:0;const lim=proj*metaDe(k)/100;const saldo=lim-rec[k]-ped[k];r[k]={fat:fat[k],proj,man:man>0,lim,rec:rec[k],ped:ped[k],saldo,p:fat[k]?rec[k]/fat[k]:NaN};for(const x in t)t[x]+=r[k][x]}
  t.p=t.fat?t.rec/t.fat:NaN;r.total=t;r.dd=dd;r.dm=dm;return r}
V.compras=()=>{const t=S.ui.tab.compras;
  return `${ph('Compras','Lance notas e pedidos e acompanhe as compras contra o faturamento.',io('compras','compras')+`<button class="btn" data-act="novaCompra">+ Lançar compra</button>`)}
  ${tabs('compras',[['orcamento','Compras × faturamento'],['notas','Notas e pedidos'],['forn','Gastos por fornecedor'],['cad','Fornecedores']])}
  ${t==='notas'?comprasNotas():t==='forn'?comprasForn():t==='cad'?comprasFornCad():comprasOrc()}`};
function comprasOrc(){const m=S.ui.orcMes;const o=orcamento(m);
  return `<div class="bar">${fld('Mês',`<input type="month" id="orc-mes" data-bind="orcMes" value="${esc(m)}">`)}<p class="muted" style="margin:0 0 8px;max-width:62ch">Limite de compras = faturamento projetado do mês × meta de CMC do setor. ${o.dd?`Projeção pelo ritmo de ${o.dd} dia${o.dd>1?'s':''} com faturamento lançado.`:'Sem faturamento lançado no mês.'}</p></div>
  <div class="tw"><table><thead><tr><th>Setor</th><th class="r">Faturado</th><th class="r">Projeção do mês</th><th class="r">Meta CMC</th><th class="r">Limite de compras</th><th class="r">Recebido</th><th class="r">Pedidos abertos</th><th class="r">Saldo</th><th class="r">Compras / faturado</th></tr></thead><tbody>
  ${SETORES.map(([k,n])=>{const x=o[k];return `<tr><td>${sp(k)}</td><td class="r">${brl(x.fat)}</td><td class="r">${brl(x.proj)}${x.man?' <small>(manual)</small>':''}</td><td class="r">${nf(metaDe(k),1)}%</td><td class="r">${brl(x.lim)}</td><td class="r">${brl(x.rec)}</td><td class="r">${brl(x.ped)}</td><td class="r ${x.saldo<0?'diff-neg':'diff-pos'}">${brl(x.saldo)}</td><td class="r"><span class="pill ${st(x.p,metaDe(k))}">${pct(x.p)}</span></td></tr>`}).join('')}
  </tbody><tfoot><tr><td>Total</td><td class="r">${brl(o.total.fat)}</td><td class="r">${brl(o.total.proj)}</td><td></td><td class="r">${brl(o.total.lim)}</td><td class="r">${brl(o.total.rec)}</td><td class="r">${brl(o.total.ped)}</td><td class="r">${brl(o.total.saldo)}</td><td class="r">${pct(o.total.p)}</td></tr></tfoot></table></div>
  <section class="cmc-grid">${SETORES.map(([k,n])=>{const x=o[k];const u=x.lim?Math.min(100,(x.rec+x.ped)/x.lim*100):0;return `<article class="cmc s-${k}"><header><span class="dot"></span>${n}<span class="pill ${x.saldo<0?'bad':u>85?'warn':'ok'}">${x.lim?nf(u,0)+'% do limite':'sem limite'}</span></header><div class="meter"><i style="width:${u}%"></i></div><dl><dt>Pode comprar ainda</dt><dd class="${x.saldo<0?'diff-neg':''}">${brl(x.saldo)}</dd></dl></article>`}).join('')}</section>`}
function comprasNotas(){const l=[...S.d.compras].sort((a,b)=>(b.data+(b.atualizadoEm||'')).localeCompare(a.data+(a.atualizadoEm||'')));
  return `<div class="tw"><table><thead><tr><th>Data</th><th>Fornecedor</th><th>NF / pedido</th><th>Setores</th><th class="r">Itens</th><th class="r">Total</th><th>Status</th><th></th></tr></thead><tbody>

   <td>${c.status==='pedido'?(c.enviadoEm?`<span class="pill info">Enviado ${fdm(c.enviadoEm.slice(0,10))}</span>`:'<span class="pill warn">Pedido</span>'):'<span class="pill ok">Recebida</span>'}</td><td class="r" style="white-space:nowrap">${c.status==='pedido'?`<button class="btn ghost sm" data-act="envAbrir" data-id="${c.id}">${ic('send')}Enviar</button> <button class="btn sm" data-act="cReceber" data-id="${c.id}">Receber</button> `:''}<button class="btn ghost sm" data-act="cAbrir" data-id="${c.id}">Abrir</button></td></tr>`}).join('')||`<tr><td colspan="8" class="empty">Nenhuma compra lançada.</td></tr>`}</tbody></table></div>`}
function comprasForn(){const m=S.ui.orcMes;const a=m+'-01',b=m+'-'+pad(diasMes(m));const g={};for(const c of S.d.compras){if(c.status!=='recebida'||!inR(c.data,a,b))continue;const k=c.fornecedor||'—';g[k]=g[k]||{n:0,t:0};g[k].n++;g[k].t+=+c.total||0}

  ${l.map(x=>`<tr><td>${fdt(x.data)}</td><td class="r">${brl(x.cozinha)}</td><td class="r">${brl(x.bar)}</td><td class="r">${brl(x.adega)}</td><td class="r"><b>${brl((+x.cozinha||0)+(+x.bar||0)+(+x.adega||0))}</b></td><td class="r" style="white-space:nowrap"><button class="btn ghost sm" data-act="fatEditar" data-id="${x.id}">Editar</button> <button class="btn ghost sm" data-act="fatExcluir" data-id="${x.id}">Excluir</button></td></tr>`).join('')||`<tr><td colspan="6" class="empty">Nenhum dia lançado em ${nomeMes(m)}.</td></tr>`}
  </tbody>${l.length?`<tfoot><tr><td>Total</td><td class="r">${brl(t.cozinha)}</td><td class="r">${brl(t.bar)}</td><td class="r">${brl(t.adega)}</td><td class="r">${brl(tt)}</td><td></td></tr></tfoot>`:''}</table></div>`};

  </tbody></table></div>`};
function invView(){const inv=S.d.inventarios.find(x=>x.id===S.ui.invId);if(!inv)return '';const it=[...(inv.itens||[])].sort((a,b)=>(a.setor+a.nome).localeCompare(b.setor+b.nome));let se=null;

async function hashPw(pw,salt){const enc=new TextEncoder();const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},key,256);return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function novaSenha(k,pw){const salt=uid()+uid()+uid();const doc={salt,hash:await hashPw(pw,salt),atualizadoEm:new Date().toISOString()};if(S.db)await S.db.doc('senhas/'+k).set(doc);else S.sen[k]=doc}
function entrarComo(r){S.role=r;S.view='painel';S.ui.login={role:null,pw:'',err:'',busy:false,tries:0,lock:0};try{sessionStorage.setItem('mp-role',r)}catch(e){}render();window.scrollTo(0,0)}
A.loginSel=d=>{if(d.r==='admin'&&!S.canAdmin)return;S.ui.login.role=d.r;S.ui.login.pw='';S.ui.login.err='';render();setTimeout(()=>{const el=document.getElementById(fid('login.pw'));if(el)el.focus()},20)};
A.loginEntrar=async()=>{const L=S.ui.login;if(L.busy)return;const k=L.role==='admin'?'adm':'equipe';
  if(Date.now()<L.lock){L.err=`Muitas tentativas. Aguarde ${Math.ceil((L.lock-Date.now())/1000)} segundos.`;return render()}
  const sen=S.sen[k];if(!sen){L.err=k==='equipe'?'A senha da equipe ainda não foi criada. Peça ao Adm para criar em Ajustes.':'Senha do Adm não encontrada.';return render()}
  if(!L.pw){L.err='Digite a senha.';return render()}
  L.busy=true;L.err='';render();let ok=false;try{ok=(await hashPw(L.pw,sen.salt))===sen.hash}catch(e){L.busy=false;L.err='Não foi possível verificar a senha neste navegador.';return render()}
  L.busy=false;if(ok)return entrarComo(L.role);
  L.tries++;L.pw='';if(L.tries>=5){L.lock=Date.now()+30000;L.tries=0;L.err='Senha incorreta. Aguarde 30 segundos para tentar de novo.'}else L.err='Senha incorreta.';render()};
A.setupSalvar=async()=>{const f=S.ui.setup;f.err='';
  if(f.a1.length<4||f.e1.length<4)f.err='As senhas precisam ter pelo menos 4 caracteres.';else if(f.a1!==f.a2)f.err='As senhas do Adm não conferem.';else if(f.e1!==f.e2)f.err='As senhas da equipe não conferem.';else if(f.a1===f.e1)f.err='Use senhas diferentes para Adm e equipe.';
  if(f.err)return render();f.busy=true;render();
  try{await novaSenha('adm',f.a1);await novaSenha('equipe',f.e1);S.ui.setup={a1:'',a2:'',e1:'',e2:'',err:'',busy:false};toast('Senhas criadas');entrarComo('admin')}catch(e){f.busy=false;f.err=errMsg(e);render()}};
A.pwSalvar=d=>{const f=S.ui.pwf;const k=d.k;const p1=k==='adm'?f.a1:f.e1,p2=k==='adm'?f.a2:f.e2;

A.prSalvar=()=>{const r=prCalc();if(!r)return;if(!(r.L>0))return toast('Informe a quantidade de lotes.',true);if(!(r.real>0))return toast('Informe a quantidade produzida (real).',true);if(!r.prod)return toast('A ficha não tem item produzido vinculado. Ajuste em Fichas técnicas.',true);
  run(async()=>{const delta={};for(const i of r.itens){if(i.p)delta[i.p.id]=(delta[i.p.id]||0)-i.q}
   const cu=r.custo/r.real;const pr=r.prod;const qOld=Math.max(0,+pr.qtd||0);

   ups.push(put('produtos',{...pr,qtd:Math.round(((+pr.qtd||0)+(delta[pr.id]||0)+r.real)*1000)/1000,custo:Math.round(novoCusto*100)/100}));await Promise.all(ups);

async function entradaEstoque(itens,sinal=1,extra){const g={};for(const i of itens){const x=g[i.produtoId]=g[i.produtoId]||{q:0,v:0};x.q+=i.qtd;x.v+=i.qtd*i.valor}
  await Promise.all(Object.entries(g).map(([pid,x])=>{const p=(extra&&extra.get(pid))||P(pid);if(!p)return null;const qOld=+p.qtd||0;let custo=+p.custo||0;

  const prompt=`Você vai organizar dados extraídos de um PDF de ${def.nome} de um restaurante (exportado de outro aplicativo). Leia o texto abaixo (as colunas originais aparecem separadas por " | ") e extraia cada registro.
Responda SOMENTE com um array JSON de objetos com exatamente estas chaves: ${desc}.
Regras: números como número JSON com ponto decimal (ex.: 1234.5); datas no formato AAAA-MM-DD; unidade em minúsculas (kg, g, L, ml, un, cx); ${I.alvo==='fichas'?'repita o nome da ficha em cada ingrediente; ':''}ignore cabeçalhos, totais, subtotais, rodapés e números de página; use "" quando o campo não existir.
Exemplo de um item: {${ks.map(k=>`"${k}": ""`).join(', ')}}

Texto do PDF:
${I.pdf.slice(0,42000)}`;
  I.busy='Lendo o PDF com IA… (pode levar até um minuto)';I.err='';render();
  try{const arr=await S.sample.json(prompt);if(!Array.isArray(arr)||!arr.length)throw{code:'vazio'};
    I.sheets=[{nome:'Lido pela IA',rows:[def.campos.map(c=>c[1]),...arr.map(o=>ks.map(k=>o&&o[k]!=null?o[k]:''))]},...I.sheets.filter(s=>s.nome!=='Lido pela IA')];impSheet(0);I.ia=true}
  catch(e){I.err=e.code==='not_granted'||e.code==='sampling_disabled'?'A leitura com IA não foi autorizada nesta visualização.':e.code==='rate_limited'?'Limite de uso atingido. Tente mais tarde.':e.code==='vazio'||e.code==='invalid_json'?'A IA não encontrou registros neste PDF. Confira o arquivo ou use o mapeamento manual.':'Não foi possível ler com IA agora. Tente de novo.'}
  I.busy='';render()};

    <div class="grid3">${I.sheets.length>1?fld('Aba',sel('imp.sheet',I.sheets.map((s,i)=>[i,s.nome]))):''}${fld('Linha de cabeçalho',sel('imp.head',[[-1,'Sem cabeçalho'],...I.rows.slice(0,15).map((r,i)=>[i,`Linha ${i+1}: ${r.filter(c=>String(c).trim()).slice(0,3).join(' · ').slice(0,40)}`])]))}</div>
    <h3 style="font-size:15px">Qual coluna é cada informação?</h3>
    <div class="grid3">${def.campos.map(([k,l,req])=>fld(l+(req?' *':''),sel('imp.map.'+k,[['','— não importar —'],...Array.from({length:cols},(_,i)=>[i,hdr(i)])]))).join('')}</div>

    ${regs.length>80?`<tr><td colspan="${def.campos.length+1}" class="muted">+ ${regs.length-80} linhas…</td></tr>`:''}</tbody></table></div>`:''}
  </div>
  <footer><button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn" data-act="impConfirmar" ${I.rows&&ok&&!I.busy?'':'disabled'}>Importar ${ok||''} registro${ok===1?'':'s'}</button></footer>`}
A.impModelo=async()=>{const def=IMP[S.ui.imp.alvo];try{await lib('xlsx');const d={secs:[{nome:'Modelo',head:def.campos.map(c=>c[1]),rows:def.ex}]};await baixar(`modelo-${S.ui.imp.alvo}.xlsx`,new Uint8Array(await gerarXLSX(d)))}catch(e){toast('Não foi possível gerar o modelo.',true)}};
async function emLotes(fns){for(let i=0;i<fns.length;i+=10)await Promise.all(fns.slice(i,i+10).map(f=>f()))}
function novoProd(nome,o,novos,setorDef){const u=unid(o.unidade);const p={id:uid(),nome:String(nome).trim(),categoria:'Importados',setor:setorDe(o.setor,setorDef),grupo:grupoDe(o.grupo,'estoque'),unidade:u==='g'?'kg':u==='ml'?'L':(u||'un'),custo:0,qtd:0,minimo:0,ideal:0,fornecedor:String(o.fornecedor||'').trim(),producao:false,ativo:true};novos.set(norm(nome),p);return p}
A.impConfirmar=async()=>{const I=S.ui.imp;const regs=impRegs().filter((o,i)=>impStatus(o)[0]!=='bad');if(!regs.length)return;I.busy='Importando…';render();
  const novos=new Map();let msg='';
  try{
   if(I.alvo==='produtos'){let n=0,u=0;const docs=[];
     for(const o of regs){const ex=acharProd(o.nome,novos);const base=ex?{...ex}:novoProd(o.nome,o,novos,I.opts.setor);
       const set=(k,v)=>{if(v!==''&&v!=null)base[k]=v};set('categoria',String(o.categoria||'').trim()||undefined);if(o.setor!=='')base.setor=setorDe(o.setor,base.setor);if(o.grupo!=='')base.grupo=grupoDe(o.grupo,base.grupo);
       if(unid(o.unidade))base.unidade=unid(o.unidade);for(const k of ['custo','qtd','minimo','ideal'])if(String(o[k]??'').trim()!=='')base[k]=pn(o[k]);if(String(o.fornecedor||'').trim())base.fornecedor=String(o.fornecedor).trim();
       if(ex)u++;else n++;novos.set(norm(base.nome),base);docs.push(base)}
     const uniq=[...new Map(docs.map(d=>[d.id,d])).values()];await emLotes(uniq.map(d=>()=>put('produtos',d)));msg=`${n} produto(s) novo(s) e ${u} atualizado(s)`}
   if(I.alvo==='compras'){const grupos=new Map();const criar=[];
     for(const o of regs){let p=acharProd(o.produto,novos);if(!p){p=novoProd(o.produto,{...o,fornecedor:o.fornecedor||I.opts.fornecedor},novos,I.opts.setor);criar.push(p)}
       const de=unid(o.unidade)||p.unidade;const q=conv(pn(o.qtd),de,p.unidade);const temV=String(o.valor??'').trim()!=='';let v=temV?pn(o.valor):(+p.custo||0);if(temV&&q&&pn(o.qtd))v=v*pn(o.qtd)/q;
       if(criar.includes(p)&&!p.custo)p.custo=Math.round(v*100)/100;
       const forn=String(o.fornecedor||'').trim()||I.opts.fornecedor.trim()||'Importado';const data=isoDe(o.data)||I.opts.data||hoje();const key=forn+'|'+data;
       if(!grupos.has(key))grupos.set(key,{forn,data,itens:[]});grupos.get(key).itens.push({produtoId:p.id,nome:p.nome,setor:p.setor,unidade:p.unidade,qtd:Math.round(q*1000)/1000,valor:Math.round(v*100)/100})}
     await emLotes(criar.map(p=>()=>put('produtos',p)));const mapa=new Map(criar.map(p=>[p.id,p]));
     if(I.opts.status==='recebida')await entradaEstoque([...grupos.values()].flatMap(g=>g.itens),1,mapa);
     for(const g of grupos.values()){const doc={id:uid(),data:g.data,fornecedor:g.forn,nf:'',status:I.opts.status,itens:g.itens,total:Math.round(sum(g.itens,i=>i.qtd*i.valor)*100)/100,obs:'Importado de '+I.arq,aplicada:I.opts.status==='recebida'};
       await put('compras',doc)}
     msg=`${grupos.size} ${I.opts.status==='pedido'?'pedido(s)':'nota(s)'} criada(s) com ${regs.length} itens${criar.length?` · ${criar.length} produto(s) novo(s)`:''}`;S.ui.tab.compras='notas'}
   if(I.alvo==='fichas'){const fs=new Map();for(const o of regs){const k=norm(o.ficha);if(!fs.has(k))fs.set(k,{nome:String(o.ficha).trim(),rows:[]});fs.get(k).rows.push(o)}const criar=[];const docs=[];
     for(const f of fs.values()){const first=k=>{const r=f.rows.find(r=>String(r[k]??'').trim()!=='');return r?r[k]:''};const tipo=first('tipo')!==''?tipoDe(first('tipo')):'prato';const setor=setorDe(first('setor'),I.opts.setor);
       const itens=[];for(const o of f.rows){let p=acharProd(o.ingrediente,novos);const de=unid(o.unidade);if(!p){p=novoProd(o.ingrediente,{unidade:o.unidade,setor},novos,setor);criar.push(p)}
         let q=conv(pn(o.qtd),de||p.unidade,p.unidade);if(criar.includes(p)&&String(o.custo??'').trim()!==''&&!p.custo)p.custo=pn(o.custo);itens.push({produtoId:p.id,qtd:Math.round(q*10000)/10000,fc:pn(o.fc)||1})}
       const ex=S.d.fichas.find(x=>norm(x.nome)===norm(f.nome));let produtoId='';
       if(tipo==='producao'){let pp=acharProd(f.nome,novos);if(!pp){pp=novoProd(f.nome,{unidade:'kg',setor},novos,setor);pp.categoria='Produção';criar.push(pp)}pp.producao=true;if(!criar.includes(pp))criar.push({...pp});produtoId=pp.id}
       docs.push({...(ex||{}),id:ex?ex.id:uid(),nome:f.nome,tipo,setor,porcoes:pn(first('porcoes'))||(ex?ex.porcoes:1)||1,preco:tipo==='producao'?0:(pn(first('preco'))||(ex?ex.preco:0)||0),produtoId:produtoId||(ex?ex.produtoId:''),itens,preparo:ex?ex.preparo||'':''})}
     await emLotes([...new Map(criar.map(p=>[p.id,p])).values()].map(p=>()=>put('produtos',p)));await emLotes(docs.map(d=>()=>put('fichas',d)));
     msg=`${docs.length} ficha(s) importada(s)${criar.length?` · ${criar.length} ingrediente(s) novo(s) cadastrado(s)`:''}`}
   if(I.alvo==='faturamento'){const docs=new Map();for(const o of regs){const d=isoDe(o.data);if(!d)continue;const ex=S.d.faturamento.find(f=>f.data===d)||{};const doc=docs.get(d)||{id:d,data:d,cozinha:+ex.cozinha||0,bar:+ex.bar||0,adega:+ex.adega||0};for(const k of ['cozinha','bar','adega'])if(String(o[k]??'').trim()!=='')doc[k]=pn(o[k]);docs.set(d,doc)}
     await emLotes([...docs.values()].map(d=>()=>put('faturamento',d)));msg=`${docs.size} dia(s) de faturamento importado(s)`}
   if(I.alvo==='contagem'){const itens={};for(const o of regs){const p=acharProd(o.produto);if(p)itens[p.id]=pn(o.qtd)}const n=Object.keys(itens).length;
     await put('contagens',{id:uid(),data:I.opts.data||hoje(),grupo:I.opts.grupo,status:'enviada',itens,por:(S.me&&S.me.id)||null});msg=`Contagem importada com ${n} itens. Revise e aplique ao estoque.`;S.ui.ct=null}
   S.ui.drawer=null;S.ui.imp=null;render();toast(msg||'Importação concluída')}
  catch(e){console.error(e);I.busy='';I.err=errMsg(e);render()}};
