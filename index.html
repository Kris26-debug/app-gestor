function fornDoc(nome){const n=norm(nome);return S.d.fornecedores.find(f=>norm(f.nome)===n)}
function todosForn(){const m=new Map();for(const n of fornecedores())m.set(norm(n),{nome:n});for(const f of S.d.fornecedores)m.set(norm(f.nome),f);return [...m.values()].sort((a,b)=>a.nome.localeCompare(b.nome))}
function waNum(t){let d=String(t||'').replace(/\D/g,'');if(!d)return '';if(d.length<=11)d='55'+d.replace(/^0+/,'');return d}
function waLink(num,msg){const n=waNum(num);return `https://wa.me/${n}?text=${encodeURIComponent(msg)}`}
const assin=()=>S.cfg.empresa?`\n\n${S.cfg.empresa}`:'';
function msgPedido(c){return `Olá${c.fornecedor?', '+c.fornecedor:''}! Segue nosso pedido de ${fdt(hoje())}:\n\n${(c.itens||[]).map(i=>`• ${i.nome||(P(i.produtoId)||{}).nome||''}: ${nf(i.qtd)} ${i.unidade||''}${+i.valor?` (${brl(i.valor)}/${i.unidade||'un'})`:''}`).join('\n')}\n\nTotal estimado: ${brl(c.total)}\nPor favor, confirme o recebimento do pedido e a previsão de entrega. Obrigado!${assin()}`}
function msgCotacao(c,forn){return `Olá, ${forn}! Poderia nos passar a cotação dos itens abaixo?\n\n${c.itens.map(i=>`• ${i.nome}: ${nf(pn(i.qtd))} ${i.unidade||''}`).join('\n')}\n\nSe possível, informe também prazo de entrega e condição de pagamento. Obrigado!${assin()}`}

/* ---- tela de cotações ---- */
function cotCalc(c){const F=c.forn.length;const tot=Array(F).fill(0),cnt=Array(F).fill(0);let melhor=0,itensOk=0,econ=0;
  const best=c.itens.map(it=>{const q=pn(it.qtd);let bj=-1,bv=Infinity;(it.p||[]).forEach((v,j)=>{if(j>=F)return;const x=pn(v);if(String(v??'').trim()!==''&&x>0){tot[j]+=x*q;cnt[j]++;if(x<bv){bv=x;bj=j}}});
    if(bj>=0){melhor+=bv*q;itensOk++;const ref=+(P(it.produtoId)||{}).custo||0;if(ref)econ+=(ref-bv)*q}return{j:bj,v:bj>=0?bv:NaN}});
  return{tot,cnt,best,melhor,itensOk,econ}}
V.cotacoes=()=>{if(S.ui.cot)return cotTela();
  const l=[...S.d.cotacoes].sort((a,b)=>(b.data+(b.atualizadoEm||'')).localeCompare(a.data+(a.atualizadoEm||'')));
  return `${ph('Cotações','Compare preços de vários fornecedores lado a lado, peça preços por WhatsApp e gere os pedidos com o melhor preço de cada item.',io('cotacoes')+`<button class="btn ghost" data-act="cotNova" data-src="planilha">Cotar itens da planilha</button><button class="btn" data-act="cotNova">+ Nova cotação</button>`)}
  <div class="tw"><table><thead><tr><th>Data</th><th>Cotação</th><th class="r">Itens</th><th>Fornecedores</th><th class="r">Melhor combinação</th><th>Status</th><th></th></tr></thead><tbody>
  ${l.map(c=>{const d=cotDraft(c);const k=cotCalc(d);return `<tr><td>${fdt(c.data)}</td><td class="nm">${esc(c.titulo||'Cotação')}</td><td class="r">${(c.itens||[]).length}</td><td>${esc((c.forn||[]).join(', '))||'—'}</td><td class="r">${k.itensOk?brl(k.melhor):'—'} <small>${k.itensOk}/${(c.itens||[]).length} cotados</small></td>
   <td>${c.status==='fechada'?'<span class="pill ok">Pedidos gerados</span>':'<span class="pill warn">Aberta</span>'}</td><td class="r"><button class="btn ghost sm" data-act="cotAbrir" data-id="${c.id}">Abrir</button></td></tr>`}).join('')||`<tr><td colspan="7" class="empty">Nenhuma cotação ainda. Comece pelos itens da planilha de compras ou crie uma nova.</td></tr>`}</tbody></table></div>`};
function cotDraft(c){const F=(c.forn||[]).length;return{...c,forn:[...(c.forn||[])],itens:(c.itens||[]).map(i=>({...i,qtd:numStr(i.qtd),p:Array.from({length:F},(_,j)=>i.p&&i.p[j]!=null&&i.p[j]!==''?numStr(i.p[j]):'')})),novoForn:'',addPid:'',addQtd:''}}
function cotTela(){const c=S.ui.cot;const k=cotCalc(c);const ro=c.status==='fechada';const F=c.forn.length;
  const fl=todosForn().filter(f=>!c.forn.some(x=>norm(x)===norm(f.nome)));
  return `${ph(esc(c.titulo||'Nova cotação'),`${fdt(c.data)} · ${c.itens.length} itens · ${F} fornecedor${F===1?'':'es'}${ro?' · pedidos já gerados':''}`,io('cotacao')+`<button class="btn ghost" data-act="cotFechar">← Voltar</button>`)}
  <div class="card"><div class="grid3">${fld('Nome da cotação',inp('cot.titulo',{ph:'Ex.: Hortifrúti semana 39',dis:ro}))}${fld('Data',inp('cot.data',{type:'date',dis:ro}))}</div>
   ${ro?'':`<div class="bar">${fld('Adicionar fornecedor',`<input type="text" id="f-cot-novoForn" data-bind="cot.novoForn" list="dl-cotf" value="${esc(c.novoForn)}" placeholder="Nome do fornecedor">`)}<button class="btn ghost" data-act="cotAddForn">+ Fornecedor</button><datalist id="dl-cotf">${fl.map(f=>`<option value="${esc(f.nome)}">`).join('')}</datalist></div>`}
   ${F?`<div class="chips">${c.forn.map((f,j)=>{const d=fornDoc(f)||{};return `<span class="chip"><b>${esc(f)}</b><a class="btn sm ${d.whatsapp?'':'ghost'}" href="${waLink(d.whatsapp,msgCotacao(c,f))}" target="_blank" rel="noopener" title="${d.whatsapp?'Enviar pedido de cotação pelo WhatsApp':'Sem WhatsApp cadastrado: escolha o contato no WhatsApp'}">${ic('wa')}Pedir preços</a>${ro?'':`<button class="x" data-act="cotRemForn" data-j="${j}" aria-label="Remover ${esc(f)}">×</button>`}</span>`}).join('')}</div>`:'<p class="muted" style="margin:0">Adicione pelo menos dois fornecedores para comparar.</p>'}
  </div>
  <div class="tw"><table class="cot"><thead><tr><th>Produto</th><th class="r">Qtd.</th>${c.forn.map(f=>`<th class="r">${esc(f)}</th>`).join('')}<th class="r">Melhor</th>${ro?'':'<th></th>'}</tr></thead><tbody>
  ${c.itens.map((it,i)=>{const b=k.best[i];const ref=+(P(it.produtoId)||{}).custo||0;return `<tr><td><div class="nm">${esc(it.nome)}</div><small>último custo ${ref?brl(ref):'—'}/${esc(it.unidade||'')}</small></td>
   <td class="r"><div style="display:flex;gap:6px;align-items:center;justify-content:flex-end">${inp(`cot.itens.${i}.qtd`,{dec:1,cls:'w-s',dis:ro})}<small>${esc(it.unidade||'')}</small></div></td>
   ${c.forn.map((f,j)=>`<td class="r ${b.j===j?'best':''}">${inp(`cot.itens.${i}.p.${j}`,{dec:1,cls:'w-s',ph:'R$',dis:ro})}</td>`).join('')}
   <td class="r">${b.j>=0?`<b>${brl(b.v)}</b><br><small>${esc(c.forn[b.j])}</small>`:'<span class="muted">—</span>'}</td>${ro?'':`<td><button class="x" data-act="cotRemItem" data-i="${i}" aria-label="Remover item">×</button></td>`}</tr>`}).join('')||`<tr><td colspan="${F+4}" class="empty">Adicione itens abaixo.</td></tr>`}
  </tbody>${c.itens.length&&F?`<tfoot><tr><td colspan="2">Total por fornecedor</td>${c.forn.map((f,j)=>`<td class="r">${brl(k.tot[j])}<br><small>${k.cnt[j]}/${c.itens.length} itens</small></td>`).join('')}<td class="r">${brl(k.melhor)}</td>${ro?'':'<td></td>'}</tr></tfoot>`:''}</table></div>
  ${ro?'':`<div class="bar">${fld('Adicionar item',sel('cot.addPid',prodOpts('Escolha um produto…')))}${fld('Quantidade',inp('cot.addQtd',{dec:1,cls:'w-s'}))}<button class="btn ghost" data-act="cotAddItem">+ Item</button></div>`}
  <section class="summary"><div><span>Melhor combinação</span><b>${brl(k.melhor)}</b></div><div><span>Itens cotados</span><b>${k.itensOk} de ${c.itens.length}</b></div><div><span>Economia vs. último custo</span><b class="${k.econ>=0?'diff-pos':'diff-neg'}">${brl(k.econ)}</b></div><div><span>Fornecedores vencedores</span><b>${new Set(k.best.filter(b=>b.j>=0).map(b=>b.j)).size}</b></div></section>
  ${ro?'':`<div class="stickybar"><div class="grow">Preencha o preço unitário de cada fornecedor. O menor preço de cada item fica destacado.</div><button class="btn ghost" data-act="cotSalvar">Salvar cotação</button><button class="btn" data-act="cotPedidos" ${k.itensOk?'':'disabled'}>Gerar pedidos pelo melhor preço</button>${c.novo?'':`<button class="btn danger" data-act="cotExcluir">Excluir</button>`}</div>`}`}
A.cotNova=d=>{let itens=[];if(d.src==='planilha')itens=plRows().filter(r=>r.q>0).map(r=>({produtoId:r.p.id,nome:r.p.nome,unidade:r.p.unidade,qtd:numStr(r.q),p:[]}));
  const forn=[...new Set(itens.map(i=>(P(i.produtoId)||{}).fornecedor).filter(Boolean))].slice(0,4);itens.forEach(i=>i.p=forn.map(()=>''));
  S.view='cotacoes';S.ui.cot={novo:true,id:uid(),titulo:d.src==='planilha'?'Reposição '+fdm(hoje()):'',data:hoje(),status:'aberta',forn,itens,novoForn:'',addPid:'',addQtd:''};render();window.scrollTo(0,0)};
A.cotAbrir=d=>{const c=S.d.cotacoes.find(x=>x.id===d.id);if(!c)return;S.ui.cot=cotDraft(c);render();window.scrollTo(0,0)};
A.cotFechar=()=>{S.ui.cot=null;render()};
A.cotAddForn=()=>{const c=S.ui.cot;const n=(c.novoForn||'').trim();if(!n)return toast('Digite o nome do fornecedor.',true);if(c.forn.some(x=>norm(x)===norm(n)))return toast('Esse fornecedor já está na cotação.',true);if(c.forn.length>=8)return toast('Use no máximo 8 fornecedores por cotação.',true);
  c.forn.push(n);c.itens.forEach(i=>i.p.push(''));c.novoForn='';render()};
A.cotRemForn=d=>{const c=S.ui.cot;const j=+d.j;c.forn.splice(j,1);c.itens.forEach(i=>i.p.splice(j,1));render()};
A.cotAddItem=()=>{const c=S.ui.cot;const p=P(c.addPid);if(!p)return toast('Escolha um produto.',true);if(c.itens.some(i=>i.produtoId===p.id))return toast('Esse item já está na cotação.',true);
  c.itens.push({produtoId:p.id,nome:p.nome,unidade:p.unidade,qtd:c.addQtd||'1',p:c.forn.map(()=>'')});c.addPid='';c.addQtd='';render()};
A.cotRemItem=d=>{S.ui.cot.itens.splice(+d.i,1);render()};
function cotDoc(status){const c=S.ui.cot;return{id:c.id,titulo:(c.titulo||'').trim()||'Cotação '+fdm(c.data||hoje()),data:c.data||hoje(),status:status||c.status||'aberta',forn:c.forn,itens:c.itens.map(i=>({produtoId:i.produtoId,nome:i.nome,unidade:i.unidade,qtd:pn(i.qtd),p:i.p.map(v=>String(v??'').trim()===''?null:pn(v))})),pedidos:c.pedidos||[]}}
A.cotSalvar=()=>run(async()=>{const d=cotDoc();await put('cotacoes',d);S.ui.cot.novo=false;S.ui.cot.titulo=d.titulo;render()},'Cotação salva');
A.cotExcluir=()=>confirmar('Excluir cotação?','A cotação será apagada. Pedidos já gerados continuam em Compras.',()=>run(async()=>{await del('cotacoes',S.ui.cot.id);S.ui.cot=null;render()},'Cotação excluída'),{ok:'Excluir',danger:1});
A.cotPedidos=()=>{const c=S.ui.cot;const k=cotCalc(c);const g=new Map();c.itens.forEach((it,i)=>{const b=k.best[i];if(b.j<0||!(pn(it.qtd)>0))return;const f=c.forn[b.j];const p=P(it.produtoId)||{};if(!g.has(f))g.set(f,[]);g.get(f).push({produtoId:it.produtoId,nome:it.nome,setor:p.setor||'cozinha',unidade:it.unidade,qtd:pn(it.qtd),valor:b.v})});
  const sem=c.itens.length-k.itensOk;
  confirmar('Gerar pedidos?',`Serão criados ${g.size} pedido(s), um por fornecedor vencedor, somando <b>${brl(k.melhor)}</b>.${sem?` ${sem} item(ns) sem preço ficarão de fora.`:''} Depois é só enviar cada pedido pelo WhatsApp.`,()=>run(async()=>{const ids=[];
   for(const [f,itens] of g){const id=uid();ids.push(id);await put('compras',{id,data:hoje(),fornecedor:f,nf:'',status:'pedido',itens,total:Math.round(sum(itens,i=>i.qtd*i.valor)*100)/100,obs:'Gerado pela cotação '+(c.titulo||''),aplicada:false,cotacaoId:c.id})}
   S.ui.cot.pedidos=ids;await put('cotacoes',cotDoc('fechada'));S.ui.cot=null;S.view='compras';S.ui.tab.compras='notas';render();window.scrollTo(0,0)},'Pedidos gerados. Use “Enviar” para mandar cada um ao fornecedor.'),{ok:'Gerar pedidos'})};

/* ---- envio de pedido por link ---- */
A.envAbrir=d=>{const c=S.d.compras.find(x=>x.id===d.id);if(!c)return;const f=fornDoc(c.fornecedor)||{};S.ui.env={id:c.id,forn:c.fornecedor||'',wa:f.whatsapp||'',email:f.email||'',msg:msgPedido(c)};render()};
A.envFechar=()=>{S.ui.env=null;render()};
A.envMarcar=()=>{const e=S.ui.env;if(!e)return;const c=S.d.compras.find(x=>x.id===e.id);if(!c)return;
  (async()=>{try{if(e.forn&&(e.wa||e.email)){const f=fornDoc(e.forn);const doc={...(f||{id:uid(),nome:e.forn}),whatsapp:e.wa.trim(),email:e.email.trim()};if(!f||f.whatsapp!==doc.whatsapp||f.email!==doc.email)await put('fornecedores',doc)}
   await put('compras',{...c,enviadoEm:new Date().toISOString()});toast('Pedido marcado como enviado')}catch(err){toast(errMsg(err),true)}})()};
A.envCopiar=async()=>{const e=S.ui.env;try{await navigator.clipboard.writeText(e.msg);toast('Mensagem copiada')}catch(err){const el=document.getElementById('f-env-msg');if(el){el.focus();el.select()}toast('Selecione o texto e copie.',true)}};
function envBox(){const e=S.ui.env;if(!e)return '';const c=S.d.compras.find(x=>x.id===e.id);if(!c)return '';
  return `<div class="modal-ov"><div class="modal" style="max-width:560px" role="dialog" aria-modal="true"><h3>Enviar pedido · ${esc(e.forn||'fornecedor')}</h3>
  <div class="grid2">${fld('WhatsApp do fornecedor',inp('env.wa',{ph:'(81) 99999-9999'}),e.wa?'':'Sem número: você escolhe o contato no WhatsApp')}${fld('E-mail (opcional)',inp('env.email',{ph:'pedidos@fornecedor.com'}))}</div>
  ${fld('Mensagem',`<textarea id="f-env-msg" data-bind="env.msg" style="min-height:220px">${esc(e.msg)}</textarea>`)}
  <small class="muted">O link abre o WhatsApp com a mensagem pronta. O número e o e-mail ficam salvos no cadastro do fornecedor.${e.email?' Para e-mail, copie a mensagem e envie para '+esc(e.email)+'.':''}</small>
  <div class="acts"><button class="btn ghost" data-act="envFechar">Fechar</button><button class="btn ghost" data-act="envCopiar">Copiar mensagem</button><a class="btn" href="${waLink(e.wa,e.msg)}" target="_blank" rel="noopener" data-act="envMarcar">${ic('wa')}Enviar pelo WhatsApp</a></div></div></div>`}

/* ---- cadastro de fornecedores ---- */
function comprasFornCad(){const l=todosForn();
  return `<p class="muted" style="margin:0">Cadastre o WhatsApp e o e-mail de cada fornecedor para enviar cotações e pedidos com um toque.</p>
  <div class="tw"><table><thead><tr><th>Fornecedor</th><th>WhatsApp</th><th>E-mail</th><th>Contato</th><th></th></tr></thead><tbody>
  ${l.map((f,i)=>{const k='fc.'+i;if(!getPath(S.ui,k))setPath(S.ui,k,{nome:f.nome,whatsapp:f.whatsapp||'',email:f.email||'',contato:f.contato||''});return `<tr><td class="nm">${esc(f.nome)}</td><td>${inp(k+'.whatsapp',{ph:'(81) 99999-9999'})}</td><td>${inp(k+'.email',{ph:'email@fornecedor.com'})}</td><td>${inp(k+'.contato',{ph:'Nome do vendedor'})}</td><td class="r"><button class="btn ghost sm" data-act="fcSalvar" data-i="${i}">Salvar</button></td></tr>`}).join('')||`<tr><td colspan="5" class="empty">Nenhum fornecedor ainda.</td></tr>`}
  </tbody></table></div>
  <div class="bar">${fld('Novo fornecedor',inp('fcNovo',{ph:'Nome do fornecedor'}))}<button class="btn ghost" data-act="fcNovo">+ Adicionar</button></div>`}
A.fcSalvar=d=>{const x=getPath(S.ui,'fc.'+d.i);if(!x)return;const f=fornDoc(x.nome);run(()=>put('fornecedores',{...(f||{id:uid()}),nome:x.nome,whatsapp:x.whatsapp.trim(),email:x.email.trim(),contato:x.contato.trim()}),'Fornecedor salvo')};
A.fcNovo=()=>{const n=(S.ui.fcNovo||'').trim();if(!n)return toast('Digite o nome do fornecedor.',true);if(fornDoc(n)||fornecedores().some(x=>norm(x)===norm(n)))return toast('Esse fornecedor já existe.',true);
  run(async()=>{await put('fornecedores',{id:uid(),nome:n,whatsapp:'',email:'',contato:''});S.ui.fcNovo='';S.ui.fc=null;render()},'Fornecedor adicionado')};

/* ================= eventos ================= */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;if(t.getAttribute('aria-disabled')==='true')return;const f=A[t.dataset.act];if(!f)return;if(t.dataset.act==='ovClose'&&e.target!==t)return;if(t.tagName!=='A')e.preventDefault();f(t.dataset,t,e)});
function onBind(t){const b=t.dataset.bind;const v=t.type==='checkbox'?t.checked:t.value;setPath(S.ui,b,v);
  let m=b.match(/^cf\.itens\.(\d+)\.produtoId$/);if(m){const it=S.ui.cf.itens[+m[1]];const p=P(v);if(p&&!String(it.valor||'').trim())it.valor=numStr(p.custo)}
  if(b==='fat.data'&&v){const x=fatDraft(v);S.ui.fat=x}
  if(b==='imp.sheet')impSheet(+v);
  if(b==='imp.head'){S.ui.imp.head=+v;S.ui.imp.map=autoMap(S.ui.imp)}
  if(b==='pf.producao'&&v&&S.ui.pf.grupo==='soft')S.ui.pf.grupo='estoque';
  if(b==='ff.tipo'&&v==='producao'&&!S.ui.ff.produtoId){}
  schedule()}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.ct){contInput(t);return}if(t.dataset.bind&&t.type!=='checkbox'&&t.tagName!=='SELECT'&&t.type!=='date'&&t.type!=='month')onBind(t)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='imp-file'){const f=t.files&&t.files[0];if(f)impArquivo(f);return}if(t.dataset.bind&&(t.type==='checkbox'||t.tagName==='SELECT'||t.type==='date'||t.type==='month'))onBind(t)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id===fid('login.pw')){e.preventDefault();A.loginEntrar();return}if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('f-setup-')){e.preventDefault();A.setupSalvar();return}if(e.key==='Escape'){if(S.ui.confirm){S.ui.confirm=null;render()}else if(S.ui.copy){S.ui.copy=null;render()}else if(S.ui.drawer){S.ui.drawer=null;render()}}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.ct){e.preventDefault();const ins=[...document.querySelectorAll('[data-ct]')];const i=ins.indexOf(e.target);if(ins[i+1]){ins[i+1].focus();ins[i+1].select()}}});

/* ================= início ================= */
async function init(){
  const c=window.claude;const use=n=>c&&c.use?Promise.resolve(c.use(n)).catch(()=>null):Promise.resolve(null);
  const [db,user,dl,sm]=await Promise.all([use('db'),use('user'),use('downloads'),use('sample')]);
  S.db=db;S.user=user;S.dl=dl;S.sample=sm;S.local=!db;
  if(user){try{S.me=await user.me();S.canAdmin=!!(S.me.canEdit||S.me.isOwner)}catch(e){S.canAdmin=true}}
  if(db)subscribe();
  try{localStorage.removeItem('rg-role');const r=sessionStorage.getItem('mp-role');if(r==='equipe'||(r==='admin'&&S.canAdmin))S.role=r}catch(e){}
  S.booted=true;render();
}
render();init();
</script>
